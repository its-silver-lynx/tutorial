<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methodology Diagram</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px;
        }

        .step {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .arrow {
            margin: 0 10px;
            font-size: 20px;
        }

        .box {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="diagram">
            <div class="step">
                <div class="box">Data Collection & Preprocessing</div>
                <div class="arrow">&#x27A1;</div>
                <div class="box">Model Selection & Fine-tuning</div>
            </div>
            <div class="step">
                <div class="arrow">&#x27A1;</div>
                <div class="box">System Architecture Design</div>
            </div>
            <div class="step">
                <div class="arrow">&#x27A1;</div>
                <div class="box">Model Integration & Testing</div>
            </div>
            <div class="step">
                <div class="arrow">&#x27A1;</div>
                <div class="box">Deployment</div>
            </div>
        </div>
    </div>
</body>
</html>
