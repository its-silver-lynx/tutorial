      .container {
        display: flex;
        flex-wrap: wrap;

      }

      .card {
        border: 1px solid red;

      }

  <body>
    <div class="container"></div>

    <script>
      let container = document.getElementsByClassName("container")[0];

      let data = fetch("https://fakestoreapi.com/products").then((items)=>{
          return items.json();
      })
      .then((items)=>{
          items.forEach((item)=>{
          container.innerHTML += `<div class="card">
          <p>${item.id}</p>
          <img src="${item.image}" alt="${item.title}">
          <p>${item.title}</p>
          <p>${item.description}</p>
          <p>${item.category}</p>
          <p>${item.price}</p>`
          }); 
      });
    </script>
  </body>
