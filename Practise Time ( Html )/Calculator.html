<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="Calculators.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h1>Calc<span>+</span></h1>
        <p>Simple Calculator App</p>
      </div>
      <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
          <button onclick="clearDisplay()">AC</button>
          <button onclick="toggleSign()">+/-</button>
          <button onclick="appendSymbol('%')">%</button>
          <button class="orange" onclick="appendSymbol('/')">/</button>

          <button onclick="appendNumber('7')">7</button>
          <button onclick="appendNumber('8')">8</button>
          <button onclick="appendNumber('9')">9</button>
          <button class="orange" onclick="appendSymbol('*')">*</button>

          <button onclick="appendNumber('4')">4</button>
          <button onclick="appendNumber('5')">5</button>
          <button onclick="appendNumber('6')">6</button>
          <button class="orange" onclick="appendSymbol('-')">-</button>

          <button onclick="appendNumber('1')">1</button>
          <button onclick="appendNumber('2')">2</button>
          <button onclick="appendNumber('3')">3</button>
          <button class="orange" onclick="appendSymbol('+')">+</button>

          <button onclick="deleteLast()">&#8635;</button>
          <button onclick="appendNumber('0')">0</button>
          <button onclick="appendDot()">.</button>
          <button class="orange" onclick="calculate()">=</button>
        </div>
      </div>
    </div>
    <script>
      let display = document.getElementById("display");
      let currentInput = "0";

      function updateDisplay() {
        display.textContent = currentInput;
      }

      function appendNumber(num) {
        if (currentInput === "0") {
          currentInput = num;
        } else {
          currentInput += num;
        }
        updateDisplay();
      }

      function appendSymbol(symbol) {
        if (!isNaN(currentInput.slice(-1))) {
          currentInput += symbol;
          updateDisplay();
        }
      }

      function appendDot() {
        const parts = currentInput.split(/[\+\-\*\/]/);
        if (!parts[parts.length - 1].includes(".")) {
          currentInput += ".";
          updateDisplay();
        }
      }

      function clearDisplay() {
        currentInput = "0";
        updateDisplay();
      }

      function deleteLast() {
        currentInput = currentInput.slice(0, -1) || "0";
        updateDisplay();
      }

      function toggleSign() {
        try {
          currentInput = String(eval(currentInput + "* -1"));
          updateDisplay();
        } catch {
          display.textContent = "Error";
        }
      }

      function calculate() {
        try {
          currentInput = String(eval(currentInput));
          updateDisplay();
        } catch {
          display.textContent = "Error";
        }
      }
    </script>
  </body>
</html>
